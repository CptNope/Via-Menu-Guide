name: Build check

# Builds every branch except main (main deploys via deploy.yml) so changes
# can be checked before they reach the live app. The build is kept as an
# artifact for testing.
on:
  push:
    branches-ignore:
      - main
      - gh-pages
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7
      - name: Publish build to the build-preview branch
        if: github.event_name == 'push'
        run: |
          cd build
          git init -q -b build-preview
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-preview
